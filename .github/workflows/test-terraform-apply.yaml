name: Terraform Apply and Destroy - IaC Security Lab

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-lab:
    runs-on: ubuntu-latest
    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::230305981162:role/GitHubActions-IaC-Security
          aws-region: eu-central-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Apply, verify, and destroy
        if: steps.plan.outcome == 'success'
        shell: bash
        run: |
          set +e

          echo "=== Applying Terraform plan ==="
          terraform -chdir=terraform apply -auto-approve tfplan
          apply_status=$?

          if [ "$apply_status" -eq 0 ]; then
            echo "=== Created resource outputs ==="
            terraform -chdir=terraform output
            output_status=$?
          else
            echo "Apply failed or partially failed; attempting cleanup."
            output_status=0
          fi

          echo "=== Destroying lab resources ==="
          terraform -chdir=terraform destroy -auto-approve
          destroy_status=$?

          echo "=== Results ==="
          echo "Apply exit code: $apply_status"
          echo "Output exit code: $output_status"
          echo "Destroy exit code: $destroy_status"

          if [ "$apply_status" -ne 0 ] || \
             [ "$output_status" -ne 0 ] || \
             [ "$destroy_status" -ne 0 ]; then
            exit 1
          fi

          echo "Lab completed and Terraform destroy succeeded."
