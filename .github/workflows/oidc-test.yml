
name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws-identity:
    runs-on: ubuntu-latest

    steps:
      
      - name: Show repository identifiers
        run: |
          echo "Owner ID: $GITHUB_REPOSITORY_OWNER_ID"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::230305981162:role/GitHubActions-IaC-Security
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity
